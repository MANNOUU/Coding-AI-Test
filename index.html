<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartes de prix</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --texte: #0f172a;
      --prix: #15803d;
      --ligne: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f1f5f9;
      color: var(--texte);
    }

    .grille {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: stretch;
      padding: 40px 16px;
    }

    .pricing {
      width: min(100%, 320px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 28px 24px 24px;
      text-align: center;
    }

    .title {
      margin: 0 0 8px;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .price {
      margin: 0 0 20px;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--prix);
    }

    .features {
      list-style: none;
      margin: 0 0 20px;
      padding: 0;
      text-align: left;
      flex: 1;
    }

    .features li {
      position: relative;
      padding: 10px 0 10px 28px;
      border-bottom: 1px solid var(--ligne);
    }

    .features li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--prix);
      font-weight: 700;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: auto;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .btn:disabled {
      background: #94a3b8;
      cursor: default;
    }

    .statut {
      min-height: 1.25rem;
      margin: 12px 0 0;
      font-size: 0.9rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main id="grille" class="grille"></main>

  <script>
    /**
     * Carte de prix réutilisable.
     * @param {string} titre
     * @param {string} prix
     * @param {string[]} caracteristiques
     * @param {string} [libelleBouton]
     * @returns {HTMLElement}
     */
    function Carte(titre, prix, caracteristiques, libelleBouton = "Démarrer l'essai") {
      const article = document.createElement("article");
      article.className = "pricing";

      const titreEl = document.createElement("h2");
      titreEl.className = "title";
      titreEl.textContent = titre;

      const prixEl = document.createElement("p");
      prixEl.className = "price";
      prixEl.textContent = prix;

      const liste = document.createElement("ul");
      liste.className = "features";
      for (const element of caracteristiques) {
        const item = document.createElement("li");
        item.textContent = element;
        liste.append(item);
      }

      const bouton = document.createElement("button");
      bouton.type = "button";
      bouton.className = "btn";
      bouton.textContent = libelleBouton;

      const statut = document.createElement("p");
      statut.className = "statut";
      statut.setAttribute("aria-live", "polite");

      bouton.addEventListener("click", () => {
        statut.textContent = "Essai démarré : " + titre;
        bouton.disabled = true;
        bouton.textContent = "Essai en cours";
      });

      article.append(titreEl, prixEl, liste, bouton, statut);
      return article;
    }

    const offres = [
      {
        titre: "Forfait de base",
        prix: "9,99 $/mois",
        caracteristiques: [
          "1 Go de stockage",
          "Assistance de base",
          "Toutes les fonctionnalités principales"
        ]
      },
      {
        titre: "Forfait pro",
        prix: "19,99 $/mois",
        caracteristiques: [
          "50 Go de stockage",
          "Assistance prioritaire",
          "Export des données"
        ],
        libelleBouton: "Choisir Pro"
      }
    ];

    const grille = document.getElementById("grille");
    for (const offre of offres) {
      grille.append(
        Carte(offre.titre, offre.prix, offre.caracteristiques, offre.libelleBouton)
      );
    }
  </script>
</body>
</html>
